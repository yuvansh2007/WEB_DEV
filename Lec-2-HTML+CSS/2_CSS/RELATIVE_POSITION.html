<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELATIVE POSITION</title>
</head>
<style>
    div{
        border: solid 2px black;
        background-color: aqua;
    }
    #relative-position{
        position: relative;
        top: 40px;
        left: 30px;
        background-color: chocolate;
    }
</style>
<body>
    <div> DIV 1</div>
    <div id="relative-position"> DIV 2</div>
    <div> DIV 3</div>
</body>
</html>
