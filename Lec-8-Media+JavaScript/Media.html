<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
    <style>
        #container{
            height: 100vh;
            width: 100vw;
            background-color: aquamarine;
            display: flex;
        }
        div{
            background-color: antiquewhite !important;
        }
        #div1{
            width: 50%;
            height: 100%;
            background-color: red;
        }
        #div2{
            width: 50%;
            height: 100%;
            background-color: pink;
        }
        @media (width<=500px) {
            #container{
                flex-direction: column;
            }
            #div1{
                width: 100%;
                height: 50%;
            }
            #div2{
                width: 100%;
                height: 50%;
            }
        }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="div1">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Nisi veritatis
        alias dignissimos quos hic provident accusantium cumque dicta doloremque
        sequi!
      </div>
      <div id="div2">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquam
        voluptates illum facilis nesciunt tempora ipsum.
      </div>
    </div>
  </body>
</html>
