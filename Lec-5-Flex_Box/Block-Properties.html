<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Properties</title>
</head>
<style>
    *{
        margin: 10px;
    }
    div{
        background-color: aqua;
        border: solid 2px black;
        height: 100px;
        width: 200px;
        display: inline-block;
    }
    span{
        background-color: yellowgreen;
        border: solid 2px black;
        height: 100px;
        width: 200px;
        display: block;
    }
</style>
<body>
    <div> Block Element Div,
        This after using <u>inline-block</u>tag behaves as a <u>inline Element</u>having block Properties
    </div>
    <span> Inline Element Span
        This after using a <u>block</u>tag behaves as a <u>block Element</u>having inline Properties
    </span>
</body>
</html>
